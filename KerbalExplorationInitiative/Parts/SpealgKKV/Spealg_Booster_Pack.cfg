PART
{
	name = Spealg_Booster_Pack
	module = Part
	author = Lil_Bread402
	MODEL
	{
		model = KerbalExplorationInitiative/Parts/SpealgKKV/Spealg_Booster_Pack
		rotation = 90, 0, 0	// X Y Z
		scale = 0.625, 0.625, 0.625
	}
	rescaleFactor = 1
	CrewCapacity = 0

// nodes

    NODE
    {
        name = Body
        transform = Body_Node
        size = 0
        method = FIXED_JOINT
    }

	TechRequired = advUnmanned
	entryCost = 900
	cost = 650
	category = Engine
	subcategory = 0
	title = KV-02 "Spealg" Booster System
	manufacturer = Kerbal Design Industries
	description = Set of 4 detachable boosters for the Spealg orbital platform. Contains fuel, motors, and extra roll control.
	attachRules = 1,1,1,1,1  // attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	mass = .006
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.15
	angularDrag = 1.5
	crashTolerance = 10
	maxTemp = 1200
	explosionPotential = 0
	vesselType = Debris
	bulkheadProfiles = size00
	stackSymmetry = 0
	tags = SDI Reagan Trickle Down Economics KEI Space Defence Initiative Brilliant Pebbles Spealg KKV Kinetic Kill Vehicle
	// stagingIcon = DECOUPLER_VERT

	RESOURCE
	{
		name = LiquidFuel
		amount = 50
		maxAmount = 50
	}
	RESOURCE
	{
		name = Oxidizer
		amount = 70
		maxAmount = 70
	}
	
	MODULE
	{
		name = ModuleAnimatedDecoupler
		ejectionForce = 200
		isOmniDecoupler = true
		explosiveNodeID = Body	
		staged = false
		animationName = deploy
		waitForAnimation = true	
	}

// motors and plume
	
	MODULE
	{
		name = ModuleEnginesFX
		moduleID = ModuleEnginesFX
		thrustVectorTransformName = BoosterEngine
		engineID = Booster
		exhaustDamage = False
		ignitionThreshold = 0.1
		minThrust = 0
		maxThrust = 8.55 // real value should be 5.7 but I'm boosting it for now
		heatProduction = 25
		EngineType = LiquidFuel
		exhaustDamageDistanceOffset = 0.05
		runningEffectName = running
		PROPELLANT
		{
			name = LiquidFuel
			ratio = 0.9
			DrawGauge = True
		}
		PROPELLANT
		{
			name = Oxidizer
			ratio = 1.1
		}
		atmosphereCurve
		{
			key = 0 250
			key = 1 100
			key = 3 0.001
		}
	}

// RCS and plume

	MODULE
	{
		name = ModuleRCSFX
		moduleID = RCS_Roll
		stagingEnabled = False
		thrusterTransformName = Booster_Roll
		thrusterPower = 0.25
		resourceName = LiquidFuel
		resourceFlowMode = STAGE_PRIORITY_FLOW
		runningEffectName = running
		PROPELLANT
		{
			name = LiquidFuel
			ratio = 0.9
			DrawGauge = True
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		PROPELLANT
		{
			name = Oxidizer
			ratio = 1.1
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		atmosphereCurve
		{
			key = 0 260
			key = 1 140
			key = 5 0.001
		}
	}

}
