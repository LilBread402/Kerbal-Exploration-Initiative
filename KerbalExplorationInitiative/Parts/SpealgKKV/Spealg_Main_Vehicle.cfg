PART
{
	name = Spealg_Main_Vehicle
	module = Part
	author = Lil_Bread402
	MODEL
	{
		model = KerbalExplorationInitiative/Parts/SpealgKKV/Spealg_Main_Vehicle
		rotation = 90, 0, 0	// X Y Z
		scale = 0.625, 0.625, 0.625
	}
	rescaleFactor = 1
	CrewCapacity = 0

// nodes

    NODE
    {
        name = Booster
        transform = Booster_Node
        size = 0
        method = FIXED_JOINT
    }
	
    NODE
    {
        name = LifeJacket
        transform = Lifejacket_Node
        size = 0
        method = FIXED_JOINT
    }

// the other stuff

	TechRequired = specializedElectrics
	entryCost = 1050
	cost = 800
	category = Pods
	subcategory = 0
	title = KV-02 "Spealg" Main Vehicle System
	manufacturer = Kerbal Design Industries
	description = Main guidance and control system for the Spealg orbital platform.
	attachRules = 1,0,1,1,1  // attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	mass = .002
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.15
	angularDrag = 1.5
	crashTolerance = 12
	maxTemp = 1200 // = 1200
	explosionPotential = 0
	vesselType = Probe
	bulkheadProfiles = size00, size0
	stackSymmetry = 0
	tags = SDI Reagan Trickle Down Economics KEI Space Defence Initiative Brilliant Pebbles Spealg KKV Kinetic Kill Vehicle

	RESOURCE
	{
		name = LiquidFuel
		amount = 10.8
		maxAmount = 10.8
	}
	RESOURCE
	{
		name = Oxidizer
		amount = 13.2
		maxAmount = 13.2
	}

	RESOURCE
	{
		name = ElectricCharge
		amount = 80
		maxAmount = 80
	}

	MODULE
	{
		name = ModuleCommand
		minimumCrew = 0
		defaultControlPointDisplayName = Default
	}

	MODULE
	{
		name = ModuleReactionWheel
		PitchTorque = 0.1
		YawTorque = 0.1
		RollTorque = 0.1
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.0005
		}
	}

	MODULE
	{
		name = ModuleSAS
		SASServiceLevel = 3
	}

	MODULE
	{
		name = ModuleKerbNetAccess
		MinimumFoV = 25
		MaximumFoV = 45
		AnomalyDetection = 0
		DISPLAY_MODES
		{
			Mode = Terrain
		}
	}
	MODULE
	{
		name = ModuleDataTransmitter
		antennaType = DIRECT
		packetInterval = 0.10
		packetSize = 2
		packetResourceCost = 20.0
		requiredResource = ElectricCharge
		DeployFxModules = 0
		antennaPower = 100000000000
		antennaCombinable = True
	}

// b9 part switch

	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = LIDARLens
		switcherDescription = Lidar Cam Front Lens
		switcherDescriptionPlural = Lidar Cam Front Lens Swap
		affectDragCubes = True
		affectFARVoxels = True

		SUBTYPE 
		{
			name = Blue
			transform = LIDARLens
			primaryColor = #ffffff
			secondaryColor = #990000
			addedMass = 0
			addedCost = 0
		}
		SUBTYPE 
		{
			name = Gold
			transform = LIDARLens_Gold
			primaryColor = #ffffff
			secondaryColor = #ffffff
			addedMass = 0
			addedCost = 0
		}
	}

// RCS
	MODULE // RCS Legs
	{
		name = ModuleRCSFX
		moduleID = RCS_Legs
		stagingEnabled = False
		thrusterTransformName = RCS_Legs
		thrusterPower = 1
		resourceName = LiquidFuel
		resourceFlowMode = STAGE_PRIORITY_FLOW
		runningEffectName = running
		PROPELLANT
		{
			name = LiquidFuel
			ratio = 0.9
			DrawGauge = True
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		PROPELLANT
		{
			name = Oxidizer
			ratio = 1.1
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		atmosphereCurve
		{
			key = 0 260
			key = 1 140
			key = 5 0.001
		}
	}
	
	MODULE // RCS Roll
	{
		name = ModuleRCSFX
		moduleID = RCS_Roll
		stagingEnabled = False
		thrusterTransformName = MainRoll
		thrusterPower = 0.25
		resourceName = LiquidFuel
		resourceFlowMode = STAGE_PRIORITY_FLOW
		runningEffectName = running
		PROPELLANT
		{
			name = LiquidFuel
			ratio = 0.9
			DrawGauge = True
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		PROPELLANT
		{
			name = Oxidizer
			ratio = 1.1
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		atmosphereCurve
		{
			key = 0 260
			key = 1 140
			key = 5 0.001
		}
	}

	MODULE // ACS
	{
		name = ModuleRCSFX
		moduleID = RCS_ACS
		stagingEnabled = False
		thrusterTransformName = ACS
		thrusterPower = 0.5
		resourceName = LiquidFuel
		resourceFlowMode = STAGE_PRIORITY_FLOW
		runningEffectName = running
		PROPELLANT
		{
			name = LiquidFuel
			ratio = 0.9
			DrawGauge = True
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		PROPELLANT
		{
			name = Oxidizer
			ratio = 1.1
			resourceFlowMode = STAGE_PRIORITY_FLOW
		}
		atmosphereCurve
		{
			key = 0 260
			key = 1 140
			key = 5 0.001
		}
	}

// RCS Groups

	MODULE // Legs
	{
		name = ModuleB9AssignUiGroups
		moduleID = RCS_Legs_Group
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleRCSFX
				thrusterTransformName = RCS_Legs
			}
			uiGroupName = RCSGroup_Legs
			uiGroupDisplayName = Leg Motors
		}
	}
	
	MODULE // Roll
	{
		name = ModuleB9AssignUiGroups
		moduleID = RCS_Roll_Group
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleRCSFX
				thrusterTransformName = MainRoll
			}
			uiGroupName = RCSGroup_Roll
			uiGroupDisplayName = Roll Motors
		}
	}
	
	MODULE // Attitude
	{
		name = ModuleB9AssignUiGroups
		moduleID = RCS_ACS_Group
		MODULE
		{
			IDENTIFIER
			{
				name = ModuleRCSFX
				thrusterTransformName = ACS
			}
			uiGroupName = RCSGroup_ACS
			uiGroupDisplayName = ACS Motors
		}
	}
}
